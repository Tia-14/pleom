<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo B2B Pleom</title>
    <style>
        /* Stile generale */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            padding: 40px 20px;
            background-color: #fff;
            border-bottom: 1px solid #eaeaea;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }
        
        /* Griglia prodotti */
        #griglia-prodotti {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .slot-prodotto {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            transition: transform 0.2s ease;
        }
        .slot-prodotto:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        
        /* Immagini */
        .img-principale {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #f0f0f0;
        }
        .galleria-miniature {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .miniatura {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .miniatura:hover {
            border-color: #333;
        }
        
        /* Testi prodotto */
        .slot-prodotto h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        .dettagli-prodotto {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }
        .prezzo {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">PLEOM</div>
        <div class="subtitle">Catalogo Riservato Rivenditori (B2B)</div>
    </div>

    <div id="griglia-prodotti"></div>

    <script>
        // Funzione per cambiare l'immagine principale
        function cambiaImmagine(idImmaginePrincipale, nuovaSorgente) {
            document.getElementById(idImmaginePrincipale).src = nuovaSorgente;
        }

        // Funzione principale che carica i dati
        fetch('catalogo.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Errore di rete durante il caricamento del catalogo');
                }
                return response.json();
            })
            .then(prodotti => {
                const griglia = document.getElementById('griglia-prodotti');
                
                prodotti.forEach((prodotto, index) => {
                    const idImmagine = 'img-prod-' + index;
                    
                    let miniatureHtml = '';
                    if (prodotto.immagini && prodotto.immagini.length > 0) {
                         prodotto.immagini.forEach(imgUrl => {
                            miniatureHtml += `<img src="${imgUrl}" class="miniatura" onclick="cambiaImmagine('${idImmagine}', '${imgUrl}')">`;
                        });
                    }

                    const imgPrincipaleSrc = (prodotto.immagini && prodotto.immagini.length > 0) ? prodotto.immagini[0] : '';

                    const slot = `
                        <div class="slot-prodotto">
                            ${imgPrincipaleSrc ? `<img id="${idImmagine}" src="${imgPrincipaleSrc}" class="img-principale" alt="${prodotto.nome}">` : '<div class="img-principale" style="display:flex; align-items:center; justify-content:center; color:#999;">Nessuna immagine</div>'}
                            
                            <div class="galleria-miniature">
                                ${miniatureHtml}
                            </div>
                            
                            <h2>${prodotto.nome}</h2>
                            <div class="dettagli-prodotto">
                                <p>Codice: <strong>${prodotto.codice}</strong></p>
                                <p>Ordine Minimo: ${prodotto.moq}</p>
                            </div>
                            <div class="prezzo">Prezzo B2B: ${prodotto.prezzo}</div>
                        </div>
                    `;
                    
                    griglia.innerHTML += slot;
                });
            })
            .catch(error => {
                console.error('Si è verificato un problema:', error);
                document.getElementById('griglia-prodotti').innerHTML = '<p style="text-align:center; width:100%;">Impossibile caricare il catalogo. Riprova più tardi.</p>';
            });
    </script>
</body>
</html>
