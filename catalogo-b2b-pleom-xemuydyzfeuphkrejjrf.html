<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo B2B | Pleom</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Work Sans', sans-serif; background-color: #ffffff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-img { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<!-- Aggiunto flex, flex-col e min-h-screen per coprire sempre tutta l'altezza del dispositivo -->
<body class="bg-white text-[#101010] antialiased selection:bg-gray-200 flex flex-col min-h-screen">

    <div class="w-full flex flex-col items-center justify-center pt-[10px] pb-6">
        <img src="logo black.svg" alt="Pleom Logo" class="h-8 md:h-10 object-contain">
        <span class="text-[10px] text-[#101010] opacity-70 tracking-widest uppercase mt-2">Catalogo B2B</span>
    </div>

    <!-- Modificato max-w-7xl (più largo per PC) e px-[20px] (margini esatti a 20px su mobile) -->
    <main class="max-w-7xl mx-auto px-[20px] pb-12 flex-grow w-full">
        <!-- Griglia: 1 su mobile, 2 su tablet(md), 3 su PC(lg) -->
        <div id="griglia-prodotti" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <footer class="w-full text-center text-sm text-[#101010] mt-12 pb-[20px]">
        <p>&copy; <span id="year"></span> Pleom Design. Documento riservato.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();


        window.cambiaImmagine = function(idImmaginePrincipale, nuovaSorgente, idThumbContainer, indexThumb) {
            const imgEl = document.getElementById(idImmaginePrincipale);
            imgEl.style.opacity = '0.7';
            setTimeout(() => { imgEl.src = nuovaSorgente; imgEl.style.opacity = '1'; }, 100);
            const thumbs = document.querySelectorAll(`#${idThumbContainer} img`);
            thumbs.forEach((thumb, idx) => {
                thumb.classList.toggle('border-[#101010]', idx === indexThumb);
                thumb.classList.toggle('border-transparent', idx !== indexThumb);
                thumb.style.opacity = idx === indexThumb ? '1' : '0.6';
            });
        };

        function renderCatalogo(prodotti) {
            const griglia = document.getElementById('griglia-prodotti');
            griglia.innerHTML = '';
            prodotti.forEach((prodotto, index) => {
                const idImmagine = `img-prod-${index}`, idThumbContainer = `thumbs-prod-${index}`;
                const card = document.createElement('div');
                card.className = "group flex flex-col bg-white border-2 border-[#f0f0f0] rounded-[20px] p-[10px] transition-all duration-300 hover:shadow-md";
                
                // Le miniature ora usano w-full e aspect-square per essere sempre 1:1 responsive
                let miniatureHtml = prodotto.immagini.map((imgUrl, i) => `
                    <img src="${imgUrl}" class="w-full aspect-square object-cover rounded-[10px] cursor-pointer border transition-all duration-200 ${i === 0 ? 'border-[#101010]' : 'border-transparent opacity-60'}" 
                         onclick="cambiaImmagine('${idImmagine}', '${imgUrl}', '${idThumbContainer}', ${i})">`).join('');

                // Abbiamo sostituito i div fissi con una griglia a 5 colonne perfette
                card.innerHTML = `
                    <div class="grid grid-cols-5 gap-[10px] mb-3">
                        <div id="${idThumbContainer}" class="col-span-1 flex flex-col gap-[10px]">${miniatureHtml}</div>
                        <div class="col-span-4 relative bg-gray-50 rounded-[10px] overflow-hidden aspect-square">
                            <img id="${idImmagine}" src="${prodotto.immagini[0]}" class="absolute inset-0 w-full h-full object-cover fade-img">
                        </div>
                    </div>
                    <div class="flex-grow flex flex-col px-1 pb-1">
                        <div class="flex justify-between items-start mb-3">
                            <h2 class="text-lg font-medium text-[#101010] tracking-tight leading-tight">${prodotto.nome}</h2>
                            <span class="font-mono text-[10px] bg-[#f0f0f0] text-[#101010] px-2 py-1 rounded font-semibold whitespace-nowrap ml-2">SKU: ${prodotto.codice}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-y-2 gap-x-2 text-[11px] text-[#101010] mb-4">
                            ${['Designer', 'Dimensioni', 'Materiali', 'Colorazioni'].map(key => `<div><span class="text-[#101010] opacity-70 font-normal block text-[9px] uppercase tracking-wider mb-0.5">${key}</span> <span class="font-medium block truncate">${prodotto[key.toLowerCase()] || '-'}</span></div>`).join('')}
                        </div>
                        <div class="mt-auto pt-3 border-t border-[#f0f0f0]">
                            <div class="mb-3"><span class="text-[10px] font-semibold uppercase tracking-wider">Prezzo al pubblico consigliato (iva inc.):</span> <span class="text-xs font-semibold">${prodotto.prezzo_pubblico}</span></div>
                            <div class="flex gap-2">
                                ${['Diretto', 'Conto Vendita'].map(tipo => `<div class="bg-[#f0f0f0] rounded-lg p-2 flex-1"><span class="block text-[8.5px] font-semibold uppercase tracking-wider mb-1">${tipo === 'Diretto' ? 'Acquisto Diretto' : 'Conto Vendita'}</span><span class="text-sm font-semibold">${prodotto[`prezzo_${tipo.toLowerCase().replace(' ', '_')}`]} <span class="text-[8.5px] font-semibold">+IVA</span></span></div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                griglia.appendChild(card);
            });
        }
        
        // Init: Prova a caricare il file reale, altrimenti usa i dati di test per la preview
       async function initCatalog() {
            try {
                const response = await fetch('catalogo.json');
                if (!response.ok) {
                    throw new Error('File catalogo.json non trovato');
                }
                const prodotti = await response.json();
                renderCatalogo(prodotti.reverse());
           } catch (error) {
                console.log("Errore nel caricamento del catalogo:", error);
                const griglia = document.getElementById('griglia-prodotti');
                
                // 1. Forza il contenitore principale (<main>) a centrare i contenuti in verticale
                griglia.parentElement.classList.add('flex', 'flex-col', 'justify-center');
                
                // 2. Rimuove il layout a griglia (che non serve per il testo) e centra in orizzontale
                griglia.className = "w-full flex items-center justify-center";
                
                // 3. Inserisce il messaggio
                griglia.innerHTML = '<p class="text-center text-red-500">Impossibile caricare i prodotti in questo momento.</p>';
            }
        }

        initCatalog();
    </script>
</body>
</html>
